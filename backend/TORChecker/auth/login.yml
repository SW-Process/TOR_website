info:
  name: login
  type: http

http:
  method: POST
  url: http://localhost:8000/api/auth/login
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "vendor@example.com",
        "password": "password123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
