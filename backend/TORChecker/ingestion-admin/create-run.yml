info:
  name: create-run
  type: http

http:
  method: POST
  url: http://localhost:8000/api/ingestion/runs
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "maxProjects": 5,
        "searchText": "ซอฟต์แวร์"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
