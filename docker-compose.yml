# Local development stack: frontend + backend + mongo, all with hot reload.
# Production images are the `runner` stage of each Dockerfile (not used here).
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/tor_website
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_started

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/tor_website
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_storage:/app/storage
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    # --quiet trims mongod's startup chatter. No healthcheck: a `mongosh` probe
    # every interval floods the log with connection/auth lines (mongo 7 logs
    # each one even under --quiet). The app clients retry the connection anyway.
    command: ["--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  backend_storage:
  mongo_data:
