name: CI

# Run on every PR into main, and again on the commit that lands on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# If you push twice quickly to the same branch/PR, cancel the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Known vulnerabilities in what ships (ASVS 15.2.1): fail on high or critical.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Inventory of every third-party package in the image (ASVS 15.1.2), kept with the run.
      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom-backend.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend/sbom-backend.cdx.json

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `next build` also runs `tsc`, so this gates on type errors too.
      # `npm run lint` is NOT gated yet — see .github/workflows/README.md.
      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom-frontend.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.cdx.json
