<rect x="40" y="625" width="14" height="214" rx="7" fill="#edb51a"/>
<text x="76" y="671" font-size="30" font-weight="700" fill="#9a7200">5. Testing &amp; Integration</text>
<text x="76" y="713" font-size="23" fill="#222">Backend: 1,300+ automated tests</text>
<text x="76" y="749" font-size="23" fill="#222">CI on every pull request: typecheck,</text>
<text x="76" y="785" font-size="23" fill="#222">tests and build</text>
<text x="76" y="821" font-size="23" fill="#222">At least one review before merge</text>
<path d="M 629.0 730.0 L 600.0 732.0" stroke="#edb51a" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
<circle cx="629.0" cy="730.0" r="6" fill="#edb51a"/>
