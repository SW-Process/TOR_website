<rect x="40" y="210" width="14" height="214" rx="7" fill="#ee8300"/>
<text x="76" y="256" font-size="30" font-weight="700" fill="#ee8300">6. Maintenance</text>
<text x="76" y="298" font-size="23" fill="#222">Daily refresh of procurement status</text>
<text x="76" y="334" font-size="23" fill="#222">Alerts when a pipeline run stalls</text>
<text x="76" y="370" font-size="23" fill="#222">Admin logs and user error reports</text>
<text x="76" y="406" font-size="23" fill="#222">Docs kept up to date</text>
