<text x="1436" y="256" font-size="30" font-weight="700" fill="#b0252d">1. Planning</text>
<text x="1436" y="298" font-size="23" fill="#222">GitHub issues: problem, solution, context,</text>
<text x="1436" y="334" font-size="23" fill="#222">and a link to the requirement (FR-xx)</text>
<text x="1436" y="370" font-size="23" fill="#222">Project board: Backlog, Ready, In Progress, Done</text>
<text x="1436" y="406" font-size="23" fill="#222">Two-week sprint labels</text>
<text x="1436" y="442" font-size="23" fill="#222">Spec and plan before larger features</text>
<path d="M 1185.5 408.7 L 1400.0 335.0" stroke="#b0252d" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
