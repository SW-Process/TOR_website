<text x="1436" y="1046" font-size="30" font-weight="700" fill="#0a96dc">3. Design</text>
<text x="1436" y="1088" font-size="23" fill="#222">System design and API reference</text>
<text x="1436" y="1124" font-size="23" fill="#222">ER diagram and class diagrams</text>
<text x="1436" y="1160" font-size="23" fill="#222">Sequence diagrams</text>
<text x="1436" y="1196" font-size="23" fill="#222">Mockups for the frontend pages</text>
