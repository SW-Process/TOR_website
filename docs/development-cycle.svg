<text x="76" y="1046" font-size="30" font-weight="700" fill="#0e9f8a">4. Implementation</text>
<text x="76" y="1088" font-size="23" fill="#222">One branch per task: type/what-you-do</text>
<text x="76" y="1124" font-size="23" fill="#222">Conventional Commits, one thing per commit</text>
<text x="76" y="1160" font-size="23" fill="#222">Express + MongoDB backend, Next.js frontend</text>
<text x="76" y="1196" font-size="23" fill="#222">Pull request on the org template</text>
<path d="M 814.5 1051.3 L 600.0 1107.0" stroke="#0e9f8a" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
