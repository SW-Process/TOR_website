<text x="1436" y="671" font-size="30" font-weight="700" fill="#2a3d6b">2. Analysis</text>
<text x="1436" y="713" font-size="23" fill="#222">Software requirements specification:</text>
<text x="1436" y="749" font-size="23" fill="#222">numbered functional requirements (FR)</text>
<text x="1436" y="785" font-size="23" fill="#222">and non-functional requirements (NFR)</text>
<text x="1436" y="821" font-size="23" fill="#222">Domain model of the system&#x27;s concepts</text>
