<text x="998.0" y="1204" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">on the template,</text>
<text x="998.0" y="1234" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">link the issue</text>
<polygon points="1120,1158 1150,1175 1120,1192" fill="#0b4f8f"/>
<rect x="1156" y="1090" width="232" height="170" rx="16" fill="#f3f6fa" stroke="#0b4f8f" stroke-width="4"/>
<circle cx="1190" cy="1124" r="20" fill="#0b4f8f"/>
<text x="1190" y="1132" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text>
<text x="1272.0" y="1174" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">CI runs</text>
<text x="1272.0" y="1204" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">typecheck, tests,</text>
<text x="1272.0" y="1234" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">build</text>
<polygon points="1394,1158 1424,1175 1394,1192" fill="#0b4f8f"/>
<rect x="1430" y="1090" width="232" height="170" rx="16" fill="#f3f6fa" stroke="#0b4f8f" stroke-width="4"/>
<circle cx="1464" cy="1124" r="20" fill="#0b4f8f"/>
<text x="1464" y="1132" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text>
<text x="1546.0" y="1174" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">A teammate</text>
<text x="1546.0" y="1204" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">reviews and</text>
<text x="1546.0" y="1234" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">approves</text>
<polygon points="1668,1158 1698,1175 1668,1192" fill="#0b4f8f"/>
