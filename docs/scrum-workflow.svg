<text x="176.0" y="1204" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">from Ready, move</text>
<text x="176.0" y="1234" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">it to In Progress</text>
<polygon points="298,1158 328,1175 298,1192" fill="#0b4f8f"/>
<rect x="334" y="1090" width="232" height="170" rx="16" fill="#f3f6fa" stroke="#0b4f8f" stroke-width="4"/>
<circle cx="368" cy="1124" r="20" fill="#0b4f8f"/>
