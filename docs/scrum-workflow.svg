<text x="450.0" y="1204" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">type/what-you-do</text>
<polygon points="572,1158 602,1175 572,1192" fill="#0b4f8f"/>
<rect x="608" y="1090" width="232" height="170" rx="16" fill="#f3f6fa" stroke="#0b4f8f" stroke-width="4"/>
