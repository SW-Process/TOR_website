<text x="1820.0" y="1174" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">Merge into main,</text>
<text x="1820.0" y="1204" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">the card moves</text>
<text x="1820.0" y="1234" text-anchor="middle" font-size="22" font-weight="400" fill="#12263f">to Done</text>
