<text x="1830" y="1018" text-anchor="middle" font-size="23" font-weight="400" fill="#5b6b80">Done column</text>
<text x="120" y="1050" text-anchor="start" font-size="30" font-weight="700" fill="#0b4f8f">Inside the sprint: how one issue is finished</text>
<rect x="60" y="1090" width="232" height="170" rx="16" fill="#f3f6fa" stroke="#0b4f8f" stroke-width="4"/>
<circle cx="94" cy="1124" r="20" fill="#0b4f8f"/>
