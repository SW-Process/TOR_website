<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOR Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h4"/>
          <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
          <path d="M20 12V8l-6-6"/>
          <circle cx="15.5" cy="17.5" r="3"/>
          <path d="m22 22-2.4-2.4"/>
        </svg>
      </span>
      <div class="brand-text">
        <strong>TOR Checker</strong>
        <span class="sub">ดึงโครงการจาก e-GP</span>
      </div>
    </div>
    <button id="settingsToggle" class="icon-btn" type="button" aria-label="ตั้งค่า" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </header>

  <main>
    <section class="card main-card">
      <div class="stat">
        <span id="count" class="count">0</span>
        <span class="stat-label">โครงการที่เก็บไว้</span>
      </div>
      <p id="hint" class="hint" hidden>เปิดหน้าค้นหาของ e-GP แล้วเลื่อนดูผลลัพธ์ ระบบจะเก็บให้เอง</p>
      <button id="send" class="btn btn-primary btn-block" type="button" disabled>ส่งเข้าระบบ</button>
      <button id="clear" class="btn btn-secondary btn-block" type="button" disabled>ล้าง</button>
    </section>

    <p id="result" class="notice" role="status" hidden></p>

    <section id="settings" class="card settings" hidden>
      <h2>ตั้งค่า</h2>
      <label for="apiBase">API URL</label>
      <input id="apiBase" type="url" placeholder="http://localhost:8000">
      <p class="helper">ที่อยู่ของ backend เช่น http://localhost:8000 (ต้องอนุญาตสิทธิ์เข้าถึงเมื่อกดบันทึก)</p>
      <button id="save" class="btn btn-primary" type="button">บันทึก</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
